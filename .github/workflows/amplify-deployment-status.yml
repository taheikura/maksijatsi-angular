name: Amplify Deployment Status

'on':
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Label PRs as pending deployment
  label-pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add deployment pending label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['deployment:pending']
            });

  # Track actual deployment after merge to main
  track-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-session-name: GitHubActions

      - name: Wait for Amplify to start deployment
        run: sleep 60

      - name: Monitor deployment status
        id: deployment-status
        run: |
          MAX_ATTEMPTS=20
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Checking deployment status (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)..."
            
            JOBS=$(aws amplify list-jobs --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name main --max-items 5 --query 'jobSummaries' --output json)
            
            if [ "$JOBS" != "[]" ] && [ "$JOBS" != "null" ]; then
              # Get the most recent job
              LATEST_JOB=$(echo "$JOBS" | jq -r '.[0]')
              STATUS=$(echo "$LATEST_JOB" | jq -r '.status')
              JOB_TYPE=$(echo "$LATEST_JOB" | jq -r '.jobType')
              
              echo "Latest job type: $JOB_TYPE, status: $STATUS"
              
              # Only consider RELEASE jobs (actual deployments)
              if [ "$JOB_TYPE" = "RELEASE" ]; then
                if [ "$STATUS" = "SUCCEED" ]; then
                  echo "status=SUCCESS" >> $GITHUB_OUTPUT
                  echo "Deployment successful!"
                  exit 0
                elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
                  echo "status=FAILED" >> $GITHUB_OUTPUT
                  echo "Deployment failed with status: $STATUS"
                  exit 0
                fi
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            sleep 30
          done
          
          echo "status=TIMEOUT" >> $GITHUB_OUTPUT
          echo "Deployment monitoring timed out"

      - name: Find and update related PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.deployment-status.outputs.status }}';
            
            // Find the PR that was just merged
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            // Find the most recently merged PR
            const mergedPR = prs.find(pr => 
              pr.merged_at && 
              pr.merge_commit_sha === context.sha
            );
            
            if (mergedPR) {
              console.log(`Found merged PR #${mergedPR.number}`);
              
              // Remove pending label
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: mergedPR.number,
                  name: 'deployment:pending'
                });
              } catch (error) {
                console.log('Pending label not found or already removed');
              }
              
              // Add final status label
              let label;
              if (status === 'SUCCESS') {
                label = 'deployment:success';
              } else if (status === 'FAILED') {
                label = 'deployment:failed';
              } else {
                label = 'deployment:timeout';
              }
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mergedPR.number,
                labels: [label]
              });
              
              console.log(`Added label: ${label}`);
            } else {
              console.log('No matching merged PR found');
            }