name: Amplify Deployment Status

'on':
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Label PRs as pending deployment
  label-pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add deployment pending label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['deployment:pending']
            });

  # Track actual deployment after merge to main
  track-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          role-session-name: GitHubActions

      - name: Wait for Amplify to start deployment
        run: sleep 60

      - name: Monitor deployment status
        id: deployment-status
        run: |
          MAX_ATTEMPTS=20
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            echo "Checking deployment status (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)..."
            
            JOBS=$(aws amplify list-jobs --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name main --max-items 5 --query 'jobSummaries' --output json)
            
            if [ "$JOBS" != "[]" ] && [ "$JOBS" != "null" ]; then
              # Get the most recent job
              LATEST_JOB=$(echo "$JOBS" | jq -r '.[0]')
              STATUS=$(echo "$LATEST_JOB" | jq -r '.status')
              JOB_TYPE=$(echo "$LATEST_JOB" | jq -r '.jobType // "BUILD"')
              JOB_ID=$(echo "$LATEST_JOB" | jq -r '.jobId')
              
              echo "Latest job ID: $JOB_ID, type: $JOB_TYPE, status: $STATUS"
              
              # Check for completion (success or failure)
              if [ "$STATUS" = "SUCCEED" ]; then
                echo "status=SUCCESS" >> $GITHUB_OUTPUT
                echo "Deployment successful!"
                exit 0
              elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
                echo "status=FAILED" >> $GITHUB_OUTPUT
                echo "Deployment failed with status: $STATUS"
                
                # Get detailed error information
                echo "Fetching job details for error information..."
                JOB_DETAILS=$(aws amplify get-job --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name main --job-id "$JOB_ID" --query 'job' --output json)
                
                if [ "$JOB_DETAILS" != "null" ]; then
                  echo "Job details:"
                  echo "$JOB_DETAILS" | jq -r '.steps[] | select(.status == "FAILED") | "Step: \(.stepName), Status: \(.status), Log: \(.logUrl // "No log URL")"'
                  
                  # Get the log URL and fetch actual build logs
                  LOG_URL=$(echo "$JOB_DETAILS" | jq -r '.steps[] | select(.status == "FAILED") | .logUrl // empty' | head -1)
                  
                  if [ -n "$LOG_URL" ]; then
                    echo "Fetching build logs from: $LOG_URL"
                    BUILD_LOG=$(curl -s "$LOG_URL" | tail -50)
                    echo "=== BUILD LOG (last 50 lines) ==="
                    echo "$BUILD_LOG"
                    echo "=== END BUILD LOG ==="
                    
                    # Save log for PR comment
                    echo "LOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
                    echo "$BUILD_LOG" >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT
                  fi
                  
                  # Try to get the actual error message
                  ERROR_MSG=$(echo "$JOB_DETAILS" | jq -r '.steps[] | select(.status == "FAILED") | .statusReason // "No error message available"')
                  echo "Error details: $ERROR_MSG"
                fi
                
                exit 0
              fi
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            sleep 30
          done
          
          echo "status=TIMEOUT" >> $GITHUB_OUTPUT
          echo "LOG_CONTENT=Deployment monitoring timed out after 10 minutes" >> $GITHUB_OUTPUT
          echo "Deployment monitoring timed out"

      - name: Find and update related PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.deployment-status.outputs.status }}';
            
            // Find the PR that was just merged
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            // Find the most recently merged PR
            const mergedPR = prs.find(pr => 
              pr.merged_at && 
              pr.merge_commit_sha === context.sha
            );
            
            if (mergedPR) {
              console.log(`Found merged PR #${mergedPR.number}`);
              
              // Remove pending label
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: mergedPR.number,
                  name: 'deployment:pending'
                });
              } catch (error) {
                console.log('Pending label not found or already removed');
              }
              
              // Add final status label
              let label;
              if (status === 'SUCCESS') {
                label = 'deployment:success';
              } else if (status === 'FAILED') {
                label = 'deployment:failed';
              } else {
                label = 'deployment:timeout';
              }
              
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mergedPR.number,
                labels: [label]
              });
              
              console.log(`Added label: ${label}`);
              
              // Add comment with deployment details if failed
              if (status === 'FAILED') {
                const logContent = `${{ steps.deployment-status.outputs.LOG_CONTENT }}`;
                let body = '🚨 **Deployment Failed**\n\nThe deployment to AWS Amplify failed.';
                
                if (logContent && logContent.trim()) {
                  body += '\n\n**Build Log (last 50 lines):**\n```\n' + logContent + '\n```';
                }
                
                body += '\n\nCheck the [Amplify Console](https://console.aws.amazon.com/amplify/) for complete logs and build information.';
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: mergedPR.number,
                  body: body
                });
              }
            } else {
              console.log('No matching merged PR found');
            }